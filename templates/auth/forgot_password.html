{% extends 'base.html' %}

{% block title %}Forgot Password - {{ app_name }}{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <div class="feature-icon mx-auto mb-3" style="width: 70px; height: 70px; font-size: 1.5rem;">
                            <i class="bi bi-shield-lock"></i>
                        </div>
                        <h3 class="fw-bold">Forgot Password?</h3>
                        <p class="text-muted">Enter your email to receive a reset code</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="Enter your email"
                                    required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3">
                            <i class="bi bi-send me-2"></i>Send Reset Code
                        </button>
                    </form>

                    <div class="text-center">
                        <p class="mb-0">Remembered your password? <a href="{{ url_for('auth.login') }}"
                                class="text-primary text-decoration-none fw-bold">Back to Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
