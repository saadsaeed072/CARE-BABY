{% extends 'base.html' %}

{% block title %}Reset Password - {{ app_name }}{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <div class="feature-icon mx-auto mb-3" style="width: 70px; height: 70px; font-size: 1.5rem;">
                            <i class="bi bi-key"></i>
                        </div>
                        <h3 class="fw-bold">Reset Password</h3>
                        <p class="text-muted">Enter the 6-digit code sent to your email and your new password</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.reset_password') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        
                        <div class="mb-3">
                            <label class="form-label">Verification Code</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-hash"></i></span>
                                <input type="text" name="code" class="form-control" placeholder="6-digit code"
                                    maxlength="6" minlength="6" required>
                            </div>
                            <small class="text-muted">Check your email for the code.</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control"
                                    placeholder="Minimum 8 characters" minlength="8" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-check-all"></i></span>
                                <input type="password" name="confirm_password" class="form-control"
                                    placeholder="Repeat new password" minlength="8" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3">
                            <i class="bi bi-arrow-repeat me-2"></i>Reset Password
                        </button>
                    </form>

                    <div class="text-center">
                        <p class="mb-0">Didn't receive the code? <a href="{{ url_for('auth.forgot_password') }}"
                                class="text-primary text-decoration-none fw-bold">Try again</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
