{% extends 'base.html' %}
{% block title %}Resend Verification Email - {{ app_name }}{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0 p-4">
                    <div class="text-center mb-4">
                        <div class="feature-icon mx-auto mb-3">
                            <i class="bi bi-envelope-check"></i>
                        </div>
                        <h4 class="fw-bold">Resend Verification Email</h4>
                        <p class="text-muted small">Enter your email and we'll send a new verification link.</p>
                    </div>
                    <form method="POST" action="{{ url_for('auth.resend_verification') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" required placeholder="you@example.com">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-send me-2"></i>Send Verification Link
                        </button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('auth.login') }}" class="text-muted small">← Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
